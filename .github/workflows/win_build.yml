name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Build frontend
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Copy native module (if needed)
        shell: pwsh
        run: |
          $nativePath = "node_modules\better-sqlite3\build\Release\better_sqlite3.node"
          if (Test-Path $nativePath) {
            Copy-Item $nativePath -Destination .\
          }

      - name: Package with pkg
        shell: pwsh
        run: |
          npm install -g pkg

          # 确定入口文件
          if (Test-Path "app.js") { $entry = "app.js" }
          elseif (Test-Path "server.js") { $entry = "server.js" }
          else { Write-Error "No entry file found"; exit 1 }

          pkg $entry `
            --target node20-win-x64 `
            --output Con-Nav-Item.exe `
            --compress Brotli `
            --assets web/dist/**/* `
            --assets database/**/* `
            --assets uploads/**/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Con-Nav-Item-Win64
          path: Con-Nav-Item.exe
          if-no-files-found: error
