name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'          # 前端构建需要 Node 20+
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Build frontend
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist
          retention-days: 1

  package-backend:
    needs: build-frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'          # pkg 打包只能用 Node 18
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/dist

      - name: Copy native module (if needed)
        shell: pwsh
        run: |
          $nativePath = "node_modules\better-sqlite3\build\Release\better_sqlite3.node"
          if (Test-Path $nativePath) {
            Copy-Item $nativePath -Destination .\
          }

      - name: Package with pkg
        shell: pwsh
        run: |
          npm install -g pkg

          # 确定入口文件
          if (Test-Path "app.js") { $entry = "app.js" }
          elseif (Test-Path "server.js") { $entry = "server.js" }
          else { Write-Error "No entry file found"; exit 1 }

          pkg $entry `
            --target node18-win-x64 `
            --output Con-Nav-Item.exe `
            --compress Brotli `
            --assets web/dist/**/* `
            --assets database/**/* `
            --assets uploads/**/*

      - name: Upload final executable
        uses: actions/upload-artifact@v4
        with:
          name: Con-Nav-Item-Win64
          path: Con-Nav-Item.exe
          if-no-files-found: error
